# Glossary for translating the ORF docs and the app.
#
# Rule: use the app's own strings and the terms below. Never invent a term.
# The app's UI strings must use the same terms as the docs.
#
# [keep]  terms that are never translated.
# [terms] terms that each language translates. Empty values are not decided yet;
#         `build_docs.py status` lists them as glossary gaps.

